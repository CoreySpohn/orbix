[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "orbix"
description = "A JAX library of functions useful for exoplanet simulations"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.34",
    "numpy>=2.1.2",
    "equinox>=0.12.1",
    "interpax>=0.3.3",
    "hwoutils>=1.8",
    "jaxtyping>=0.3.3",
]
license = { file = "LICENSE" }
dynamic = ['readme', 'version']


[project.urls]
Homepage = "https://github.com/CoreySpohn/orbix"
Issues = "https://github.com/CoreySpohn/orbix/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/orbix/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orbix"]
artifacts = ["src/orbix/observatory/data/*.npz"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[project.optional-dependencies]
docs = [
  "sphinx",
  "myst-nb",
  "sphinx-book-theme",
  "sphinx-autoapi",
  "sphinx_autodoc_typehints",
  "ipython",
  "matplotlib",
  "eyepiece>=0.4.0",
  "hwostyle",
]
# The viz tests import matplotlib and eyepiece, so the test extra has to carry
# the viz extra: without it those modules fail to IMPORT on a clean runner and
# the whole viz suite silently does not run.
test = [
    "pytest",
    "beartype",
    "hypothesis",
    "pytest-cov",
    "pytest-xdist",
    "pytest-testmon",
    "pytest-markdown-docs",
    "pytest-timeout",
    "pytest-fail-slow",
    "mpmath>=1.3",
    "orbix[viz]",
    # The slow renderer tests exercise eyepiece.manim.
    "manim>=0.21,<0.22",
    # Manim 0.21 uses the Image.fromarray mode argument removed in Pillow 13.
    "pillow<13",
    "EXOSIMS",
    "astropy",
    "packaging",
]
# eyepiece>=0.4.0 for trail's `depth=` argument, which plot_orbit forwards;
# earlier eyepiece carries every other interface orbix.viz calls (sky_fan,
# trail, label_au, SourceStyles, PlotResult, animate), checked by interface in
# the test suite rather than by version string.
viz = ["eyepiece>=0.4.0", "matplotlib"]

[tool.ruff.lint]
select = ["D", "E", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "orbix"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["orbix"]
# Documentation and test tools are not runtime package imports.
optional_dependencies_dev_groups = ["docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/orbix"]
