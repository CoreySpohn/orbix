[build-system]
requires = ["hatchling>=1.26.3", "hatch-fancy-pypi-readme>=24.1", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "orbix"
description = "A JAX library of functions useful for exoplanet simulations"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.34",
    "numpy>=2.2",
    "equinox>=0.13.2",
    "interpax>=0.3.3",
    "hwoutils>=1.8",
    "jaxtyping>=0.3.3",
]
license = { file = "LICENSE" }
dynamic = ['readme', 'version']


[project.urls]
Homepage = "https://github.com/CoreySpohn/orbix"
Issues = "https://github.com/CoreySpohn/orbix/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/orbix/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orbix"]
artifacts = ["src/orbix/observatory/data/*.npz"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[project.optional-dependencies]
docs = [
  "sphinx>=8.2",
  "myst-nb>=1.1",
  "sphinx-book-theme>=1.1",
  "sphinx-autoapi>=3.1",
  "sphinx_autodoc_typehints>=2.1",
  "ipython>=8.24",
  "matplotlib>=3.11",
  "eyepiece>=0.4.0",
  "hwostyle>=1.7.0",
]
# The viz tests import matplotlib and eyepiece, so the test extra has to carry
# the viz extra: without it those modules fail to IMPORT on a clean runner and
# the whole viz suite silently does not run.
test = [
    "pytest>=7.3.2",
    "beartype>=0.18.5",
    "hypothesis>=6.79.1",
    "pytest-cov>=1.0",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "mpmath>=1.3",
    "orbix[viz]>=2.0",
    # The slow renderer tests exercise eyepiece.manim.
    "manim>=0.21,<0.22",
    # Manim 0.21 uses the Image.fromarray mode argument removed in Pillow 13.
    "pillow>=11,<13",
    "EXOSIMS>=3.4.1",
    "astropy>=6.1",
    "packaging>=23.2",
]
# eyepiece>=0.4.0 for trail's `depth=` argument, which plot_orbit forwards;
# earlier eyepiece carries every other interface orbix.viz calls (sky_fan,
# trail, label_au, SourceStyles, PlotResult, animate), checked by interface in
# the test suite rather than by version string.
viz = ["eyepiece>=0.4.0", "matplotlib>=3.11"]

[tool.ruff.lint]
select = ["D", "E", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # tol-colors 2.2 calls Colormap.set_bad, pending deprecation in Matplotlib 3.11.
    'ignore:The set_bad function will be deprecated in a future version[.].*:PendingDeprecationWarning:tol_colors',
    # Pydub 0.25.1 uses non-raw regex strings, warned on a fresh Python 3.12 import.
    'ignore:invalid escape sequence:SyntaxWarning:.*pydub[./]utils',
    # Manim imports Pydub, which still imports Python 3.12's deprecated audioop.
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:pydub\\.utils",
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "orbix"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["orbix"]
# Documentation and test tools are not runtime package imports.
optional_dependencies_dev_groups = ["docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/orbix"]
